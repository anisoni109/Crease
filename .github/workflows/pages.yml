name: Publish CREASE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified game source on first run
        id: source
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            curl --fail --location --retry 3 'https://crease-cricket-club.relaxedtang1.chatgpt.site/downloads/crease-source.tar.gz' --output /tmp/crease-source.tar.gz
            echo '27ecc30c6e7a0fa38fc66b14dfbd839a749275b31d5924c5c1a766d85157c7c5  /tmp/crease-source.tar.gz' | sha256sum --check -
            tar -xzf /tmp/crease-source.tar.gz -C .
            echo 'imported=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          VITE_PARTY_SERVER: ${{ vars.PARTY_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
